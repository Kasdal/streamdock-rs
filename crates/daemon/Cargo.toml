[package]
name = "streamdock-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Background daemon that owns the panel, paints keys and runs actions"
build = "build.rs"

[[bin]]
name = "streamdockd"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
streamdock-core = { path = "../core" }
streamdock-store = { path = "../store" }
streamdock-render = { path = "../render" }
streamdock-actions = { path = "../actions" }
streamdock-ipc = { path = "../ipc" }
serde_json.workspace = true
windows-sys.workspace = true
